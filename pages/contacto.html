  <header>

      <img src="../img/logo.png" alt="Logo de tienda online">

    <nav>
      <ul>
        <li><a href="../index.html">Inicio</a></li>

  <main>
    <section>
      <h1>Contacto</h1>
      <p>Completá el formulario para enviar una consulta sobre los productos o servicios de la tienda.</p>
      <figure>
        <img src="../assets/iconss/img/image_f9ccb3ad.jpg" alt="Computadora y cuaderno sobre un escritorio de atención">
        <figcaption>Formulario de contacto de la tienda</figcaption>
      </figure>
    </section>

    <section>
      <h2>Enviar mensaje</h2>
      <p>Dejá tus datos y el motivo de tu consulta.</p>

      <article>
        <h3>Formulario</h3>
        <form action="#" method="post">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" required>

          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" required>

          <label for="consulta">Consulta</label>
          <textarea id="consulta" name="consulta" rows="4" required></textarea>

          <button type="submit">Enviar</button>
        </form>
      </article>
    </section>
  </main>

  <footer>
    <p>2026 tienda online oficial clase 1</p>
  </footer>
</body>
